<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0812" />
      <stop offset="100%" stop-color="#120206" />
    </linearGradient>

    <linearGradient id="sk-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="25%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <linearGradient id="sk-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <linearGradient id="spotlight-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#FDA4AF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="monogram-3d-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.3" />
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="150" fill="url(#bg-burgundy)" />

  <polygon points="125,0 45,150 205,150" fill="url(#spotlight-beam)" />

  <circle cx="125" cy="4" r="4" fill="#FFFFFF" />
  <circle cx="125" cy="4" r="8" fill="#FFFFFF" opacity="0.3" />

  <g transform="translate(-15, -35) scale(0.53)" filter="url(#monogram-3d-shadow)">
    <g fill="none" stroke="#370311" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5, 6)">
      <path d="M 180 120 C 110 120, 95 180, 145 205 C 195 230, 170 290, 100 290" />
      <path d="M 225 120 L 225 290" />
      <path d="M 295 120 L 235 190 L 300 290" />
    </g>

    <g fill="none" stroke="url(#sk-edge)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 180 120 C 110 120, 95 180, 145 205 C 195 230, 170 290, 100 290" />
      <path d="M 225 120 L 225 290" />
      <path d="M 295 120 L 235 190 L 300 290" />
    </g>

    <g fill="none" stroke="url(#sk-metallic)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 180 120 C 110 120, 95 180, 145 205 C 195 230, 170 290, 100 290" />
      <path d="M 225 120 L 225 290" />
      <path d="M 295 120 L 235 190 L 300 290" />
    </g>
  </g>

  <g filter="url(#text-shadow)">
    <text x="220" y="82" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="800" 
          font-size="46" 
          fill="url(#text-grad)" 
          letter-spacing="-0.5">StageKitWP</text>

    <text x="222" y="114" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="400" 
          font-size="18" 
          fill="#F1F5F9" 
          opacity="0.9" 
          letter-spacing="0.3">Your Theatre Management Solution</text>
  </g>
</svg>
