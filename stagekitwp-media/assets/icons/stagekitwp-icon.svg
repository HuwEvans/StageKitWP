<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="25" height="25">
  <!-- Inverted Background Canvas -->


  <!-- Spotlight Cone with Inverted White Light -->
  <polygon points="10,2 3,18 17,18" fill="#FFFFFF" opacity="0.1" />

  <!-- Monogram & Fixture in Inverted White -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'S' Curve -->
    <path d="M 8 7 C 5.5 7, 5 9, 6.5 10 C 8 11, 7.5 13, 5 13" />
    <!-- 'K' Vertical -->
    <path d="M 10 7 L 10 13" />
    <!-- 'K' Arms -->
    <path d="M 13.5 7 L 10.5 10 L 13.5 13" />
    <!-- Spotlight Fixture -->
    <circle cx="10" cy="2" r="0.8" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
