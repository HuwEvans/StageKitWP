<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TM IO Import and Export">
  <defs>
    <linearGradient id="tmioBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2d8e"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="tmioSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tmioBg)"/>
  <rect x="8" y="8" width="240" height="120" rx="52" fill="url(#tmioSheen)"/>

  <!-- Database cylinder (the data) -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="128" cy="80" rx="46" ry="16" fill="#ffffff" fill-opacity="0.14"/>
    <path d="M82 80 V150 c0 8.8 20.6 16 46 16 s46-7.2 46-16 V80"/>
    <path d="M82 115 c0 8.8 20.6 16 46 16 s46-7.2 46-16"/>
  </g>

  <!-- Down arrow (import) -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M72 188 V214"/>
    <path d="M56 200 L72 216 L88 200"/>
  </g>

  <!-- Up arrow (export) -->
  <g stroke="#ffdd57" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M184 216 V190"/>
    <path d="M168 204 L184 188 L200 204"/>
  </g>
</svg>
