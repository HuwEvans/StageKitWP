<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250">
  <defs>
    <!-- Deep stage background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <!-- Spotlight cone left -->
    <radialGradient id="spot-l" cx="22%" cy="0%" r="65%" fx="22%" fy="0%">
      <stop offset="0%" stop-color="#1a78c2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a78c2" stop-opacity="0"/>
    </radialGradient>
    <!-- Spotlight cone right -->
    <radialGradient id="spot-r" cx="78%" cy="0%" r="65%" fx="78%" fy="0%">
      <stop offset="0%" stop-color="#1a78c2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a78c2" stop-opacity="0"/>
    </radialGradient>
    <!-- Curtain left gradient -->
    <linearGradient id="curt-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b1a1a"/>
      <stop offset="100%" stop-color="#6b1414"/>
    </linearGradient>
    <!-- Curtain right gradient -->
    <linearGradient id="curt-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b1414"/>
      <stop offset="100%" stop-color="#8b1a1a"/>
    </linearGradient>
    <!-- Gold rope gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#c89a20"/>
    </linearGradient>
  </defs>

  <!-- Stage background -->
  <rect width="772" height="250" fill="url(#bg)"/>

  <!-- Spotlight washes -->
  <rect width="772" height="250" fill="url(#spot-l)"/>
  <rect width="772" height="250" fill="url(#spot-r)"/>

  <!-- Subtle floor reflection line -->
  <rect x="0" y="220" width="772" height="1" fill="#1a78c2" opacity="0.18"/>
  <rect x="0" y="221" width="772" height="29" fill="#080f1e" opacity="0.5"/>

  <!-- LEFT CURTAIN — drape panels -->
  <path d="M0,0 Q30,60 18,120 Q8,180 22,250 L0,250 Z" fill="url(#curt-l)" opacity="0.95"/>
  <path d="M0,0 Q55,50 44,110 Q34,170 50,250 L28,250 Q14,180 24,120 Q36,60 12,0 Z" fill="#7a1818" opacity="0.85"/>
  <path d="M12,0 Q80,45 68,108 Q58,168 76,250 L54,250 Q36,172 46,112 Q58,52 24,0 Z" fill="#6a1212" opacity="0.75"/>
  <path d="M30,0 Q105,40 92,105 Q80,165 100,250 L80,250 Q60,166 72,106 Q86,42 42,0 Z" fill="#5a0e0e" opacity="0.65"/>

  <!-- RIGHT CURTAIN — drape panels (mirrored) -->
  <path d="M772,0 Q742,60 754,120 Q764,180 750,250 L772,250 Z" fill="url(#curt-r)" opacity="0.95"/>
  <path d="M772,0 Q717,50 728,110 Q738,170 722,250 L744,250 Q758,180 748,120 Q736,60 760,0 Z" fill="#7a1818" opacity="0.85"/>
  <path d="M760,0 Q692,45 704,108 Q714,168 696,250 L718,250 Q736,172 726,112 Q714,52 748,0 Z" fill="#6a1212" opacity="0.75"/>
  <path d="M742,0 Q667,40 680,105 Q692,165 672,250 L692,250 Q712,166 700,106 Q686,42 730,0 Z" fill="#5a0e0e" opacity="0.65"/>

  <!-- Gold valance bar -->
  <rect x="0" y="0" width="772" height="8" fill="url(#gold)"/>

  <!-- Gold tassel left -->
  <ellipse cx="155" cy="8" rx="12" ry="5" fill="#f0c040"/>
  <rect x="150" y="8" width="3" height="22" rx="1" fill="#c89a20"/>
  <ellipse cx="151.5" cy="30" rx="3" ry="4" fill="#f0c040"/>
  <rect x="155" y="8" width="3" height="28" rx="1" fill="#d4a820"/>
  <ellipse cx="156.5" cy="36" rx="3" ry="4" fill="#f0c040"/>
  <rect x="160" y="8" width="3" height="22" rx="1" fill="#c89a20"/>
  <ellipse cx="161.5" cy="30" rx="3" ry="4" fill="#e8b830"/>

  <!-- Gold tassel right (mirrored) -->
  <ellipse cx="617" cy="8" rx="12" ry="5" fill="#f0c040"/>
  <rect x="612" y="8" width="3" height="22" rx="1" fill="#c89a20"/>
  <ellipse cx="613.5" cy="30" rx="3" ry="4" fill="#f0c040"/>
  <rect x="617" y="8" width="3" height="28" rx="1" fill="#d4a820"/>
  <ellipse cx="618.5" cy="36" rx="3" ry="4" fill="#f0c040"/>
  <rect x="621" y="8" width="3" height="22" rx="1" fill="#c89a20"/>
  <ellipse cx="622.5" cy="30" rx="3" ry="4" fill="#e8b830"/>

  <!-- Stage floor boards subtle lines -->
  <line x1="100" y1="222" x2="672" y2="222" stroke="#1a3050" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="228" x2="642" y2="228" stroke="#1a3050" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="234" x2="612" y2="234" stroke="#1a3050" stroke-width="1" opacity="0.3"/>

  <!-- Main title -->
  <text x="386" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold"
        text-anchor="middle" fill="#ffffff" letter-spacing="3" opacity="0.97">Theatre Manager</text>

  <!-- Subtitle -->
  <text x="386" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400"
        text-anchor="middle" fill="#90caf9" letter-spacing="2" opacity="0.88">WordPress Plugin for Community Theatre</text>

  <!-- Bottom rule + tagline -->
  <line x1="280" y1="170" x2="492" y2="170" stroke="#1a78c2" stroke-width="1" opacity="0.6"/>
  <text x="386" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11"
        text-anchor="middle" fill="#90caf9" letter-spacing="1.5" opacity="0.65">SEASONS · SHOWS · CAST · TICKETS · DARK MODE</text>
</svg>
